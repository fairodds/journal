<style>

    --card:#ffffff;
    --ink:#16202b;
    --ink-2:#44505e;
    --muted:#79838f;
    --line:#e2e7eb;
    --hero:#16202b;
    --hero-ink:#f1f3f5;
    --hero-muted:#8d99a6;
    --amber:#d98b1f;
    --win:#1d7f55;
    --loss:#b8433a;

  }

    :root:not([data-theme="light"]){
      --bg:#0e141b;
      --card:#182029;
      --ink:#e9edf1;
      --ink-2:#bcc5cf;
      --muted:#8794a1;
      --line:#28323d;
      --hero:#1d2733;
      --hero-ink:#f1f3f5;
      --hero-muted:#93a0ad;
      --amber:#e8a94a;
      --win:#5ec191;
      --loss:#e28a82;
      --win-bg:#16291f;
      --loss-bg:#2a1a19;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e141b; --card:#182029; --ink:#e9edf1; --ink-2:#bcc5cf; --muted:#8794a1;
    --line:#28323d; --hero:#1d2733; --hero-ink:#f1f3f5; --hero-muted:#93a0ad;

  }

  .langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .langs button{
    font-family:"DM Mono",ui-monospace,monospace;font-size:11.5px;letter-spacing:.06em;
    padding:4px 9px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);cursor:pointer;
  }
  .langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .langs button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  .sports{display:flex;gap:6px;justify-content:center}
  .sports button{
    font-family:"Familjen Grotesk",system-ui,sans-serif;font-weight:600;font-size:13.5px;
    padding:8px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink-2);cursor:pointer;flex:1;
  }
  .sports button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .sports button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  h1{
    font-family:"Familjen Grotesk",system-ui,sans-serif;font-weight:700;
    font-size:22px;letter-spacing:-.01em;margin:0;
  }
  .sub{
    font-family:"DM Mono",ui-monospace,monospace;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin:6px 0 0;
  }
  .tagline{color:var(--muted);font-size:14px;margin:6px 0 0}

  h2{
    font-family:"Familjen Grotesk",system-ui,sans-serif;font-weight:600;
    font-size:15px;letter-spacing:.02em;margin:0 0 10px;color:var(--ink-2);
  }
  h2 .count{color:var(--muted);font-weight:500}

  .hero{background:var(--hero);color:var(--hero-ink);border-radius:16px;padding:22px 20px 16px}
  .hero .cap{
    font-family:"DM Mono",ui-monospace,monospace;font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted);margin:0;
  }
  .hero .num{
    font-family:"Familjen Grotesk",system-ui,sans-serif;font-weight:700;
    font-size:clamp(46px,13vw,60px);line-height:1;letter-spacing:-.03em;
    margin:8px 0 0;font-variant-numeric:tabular-nums;
  }
  .hero .from{color:var(--hero-muted);font-size:14px;margin:6px 0 0}
  .hero .spark{margin-top:14px}
  .hero .row{
    display:flex;gap:22px;margin-top:14px;padding-top:14px;
    border-top:1px solid rgba(255,255,255,.12);flex-wrap:wrap;
  }
  .hero .row div{display:flex;flex-direction:column}
  .hero .row b{
    font-family:"DM Mono",ui-monospace,monospace;font-size:22px;font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  .hero .row span{color:var(--hero-muted);font-size:12px}
  .hero .subrow{
    margin-top:10px;color:var(--hero-muted);font-size:12.5px;
    font-family:"DM Mono",ui-monospace,monospace;
  }

    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;
  }
  .stats-card h2{margin-bottom:12px}
  .stats-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;
  }
  .stats-grid .item{display:flex;flex-direction:column;gap:2px}
  .stats-grid .item .lbl{font-size:12.5px;color:var(--muted)}
  .stats-grid .item .val{
    font-family:"DM Mono",ui-monospace,monospace;font-size:17px;font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  .stats-grid .item .val.p{color:var(--win)}
  .stats-grid .item .val.n{color:var(--loss)}
  .stats-sep{
    grid-column:1/-1;border-top:1px solid var(--line);margin:2px 0;
  }

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;display:flex;flex-direction:column;gap:2px;
  }
  .live{border-color:var(--amber);border-width:1.5px}
  .live .when{
    font-family:"DM Mono",ui-monospace,monospace;font-size:12px;color:var(--amber);letter-spacing:.05em;
  }
  .match{
    font-family:"Familjen Grotesk",system-ui,sans-serif;font-weight:600;
    font-size:18px;line-height:1.25;margin-top:4px;
  }
  .league{font-size:12.5px;color:var(--muted);margin-top:2px}
  .pick{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
  }
  .pick .what{font-weight:600;font-size:16px}
  .pick .odd{
    font-family:"DM Mono",ui-monospace,monospace;font-size:20px;font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  .stack{display:flex;flex-direction:column;gap:10px}

  .res{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    display:flex;align-items:center;gap:12px;padding:11px 13px;
  }
  .res.clickable, .card.clickable{cursor:pointer}
  .res.clickable:hover, .card.clickable:hover{border-color:var(--amber)}
  .res.clickable:focus-visible, .card.clickable:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .mark{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700}
  .mark.w{background:var(--win-bg);color:var(--win)}
  .mark.l{background:var(--loss-bg);color:var(--loss)}
  .res .body{flex:1;min-width:0}
  .res .t{font-size:15px;line-height:1.3}
  .res .m{font-size:12.5px;color:var(--muted);margin-top:1px}
  .res .r{
    text-align:right;font-family:"DM Mono",ui-monospace,monospace;
    font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);flex:0 0 auto;

  .res .r b{display:block;font-size:15px;font-weight:500;color:var(--ink)}

    font-family:"DM Mono",ui-monospace,monospace;font-size:11.5px;color:var(--muted);
    margin:10px 0 0;line-height:1.6;

    background:var(--card);border:1px solid var(--line);border-radius:12px;

  summary{
    font-family:"Familjen Grotesk",system-ui,sans-serif;font-weight:600;font-size:15px;
    cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";color:var(--muted);font-family:"DM Mono",monospace}
  details[open] summary::after{content:"−"}
  summary:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}
  details p{margin:0 0 10px;font-size:14.5px;color:var(--ink-2)}
  details p:last-child{margin-bottom:0}
  details b{color:var(--ink)}

  .honest{
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--amber);
    border-radius:12px;padding:14px 16px;font-size:14.5px;color:var(--ink-2);
  }
  .honest b{color:var(--ink)}
  footer{color:var(--muted);font-size:12.5px;text-align:center;font-family:"DM Mono",ui-monospace,monospace}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* карточка сигнала — модалка по тапу (только если нет прямой ссылки в Telegram) */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.5);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  @media (min-width:600px){ .modal-backdrop{ align-items:center;padding:20px } }
  .modal{
    background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:85vh;
    overflow-y:auto;border-radius:16px 16px 0 0;padding:22px 18px 18px;position:relative;
  }
  @media (min-width:600px){ .modal{ border-radius:16px } }
  .modal-close{
    position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .modal-close:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .modal-body{
    font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;padding-right:6px;
  }
  .modal-body b{color:var(--ink);font-weight:700}

const el = id => document.getElementById(id);
const f2 = n => Number(n).toFixed(2);
const dd = s => (s || '').split('-').reverse().join('.');
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

let lang = 'ru';
try{
  const saved = localStorage.getItem('fk_lang');
  if (saved && T[saved]) lang = saved;
  else {
    const nav = (navigator.language||'ru').slice(0,2).toLowerCase();
    if (T[nav]) lang = nav;
  }
}catch(e){}

let sport = 'all';
try{
  const savedSport = localStorage.getItem('fk_sport');
  if (savedSport && ['all','football','basketball'].includes(savedSport)) sport = savedSport;
}catch(e){}

function tr(key, vars){
  let s = T[lang][key] ?? T.ru[key] ?? '';
  if (vars) for (const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}
function pick(map, name){
  const pair = map[name];
  if (!pair) return name;
  return lang === 'ru' ? pair[0] : pair[1];
}
const league = n => pick(LG, n);
const team   = n => pick(TEAMS, n);
function plural(n){
  const p = T[lang].plural;
  if (lang === 'ru'){
    const n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return p[0];
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return p[1];
    return p[2];
  }
  return n === 1 ? p[0] : p[1];
}

/* ---------- карточка сигнала (модалка по тапу, если нет ссылки на Telegram) ---------- */
let CARDS = [];
function registerCard(text){ CARDS.push(text); return CARDS.length - 1; }
function mdToHtml(s){
  if (!s) return '';
  let t = esc(s);
  t = t.replace(/\*(.+?)\*/g, '<b>$1</b>');
  t = t.replace(/\n/g, '<br>');
  return t;
}
function openCard(idx){
  const text = CARDS[idx];
  if (text == null) return;
  el('modalBody').innerHTML = mdToHtml(text);
  el('modalBackdrop').hidden = false;
}
function closeCard(){
  el('modalBackdrop').hidden = true;
}
el('modalClose').addEventListener('click', closeCard);
el('modalBackdrop').addEventListener('click', e => {
  if (e.target === el('modalBackdrop')) closeCard();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !el('modalBackdrop').hidden) closeCard();
});
document.addEventListener('click', e => {
  const linkRow = e.target.closest('[data-link]');
  if (linkRow){ window.open(linkRow.dataset.link, '_blank', 'noopener'); return; }
  const row = e.target.closest('[data-card]');
  if (!row) return;
  openCard(+row.dataset.card);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const linkRow = e.target.closest('[data-link]');
  if (linkRow){ window.open(linkRow.dataset.link, '_blank', 'noopener'); return; }
  const row = e.target.closest('[data-card]');
  if (row) openCard(+row.dataset.card);
});

/* ---------- рендер ---------- */
function cardAttrs(r){
  // Приоритет — прямая ссылка на сообщение в Telegram (r.link). Если
  // её нет (старые записи без message_id/channel) — открываем модалку
  // с текстом карточки (r.c), как раньше.
  if (r.link){
    return ' data-link="' + esc(r.link) + '" tabindex="0" role="link"';
  }
  if (r.c){
    const idx = registerCard(r.c);
    return ' data-card="' + idx + '" tabindex="0" role="button"';
  }
  return '';
}

function rowHTML(r){
  const profit = r.w ? (r.o - 1) : -1;
  const clickable = (r.link || r.c) ? ' clickable' : '';
  return '<div class="res' + clickable + '"' + cardAttrs(r) + '>'
    + '<div class="mark ' + (r.w?'w':'l') + '">' + (r.w?'✓':'✕') + '</div>'
    + '<div class="body"><div class="t">' + esc(team(r.h)) + ' — ' + esc(team(r.a)) + '</div>'
    + '<div class="m">' + tr('bet') + ': ' + esc(team(r.t)) + (r.s ? ' · ' + esc(r.s) : '') + '</div></div>'
    + '<div class="r">' + f2(r.o) + '<b>' + (profit>0?'+':'') + profit.toFixed(2) + '</b></div>'
    + '</div>';
}
function pendingHTML(p){
  const clickable = (p.link || p.c) ? ' clickable' : '';
  return '<div class="card live' + clickable + '"' + cardAttrs(p) + '>'
    + '<div class="when">' + esc(p.d) + '</div>'
    + '<div class="match">' + esc(team(p.h)) + ' — ' + esc(team(p.a)) + '</div>'
    + '<div class="league">' + esc(league(p.l)) + '</div>'
    + '<div class="pick"><span class="what">' + esc(team(p.t)) + '</span>'
    + '<span class="odd">' + f2(p.o) + '</span></div></div>';
}
function dayHead(rows){
  const w = rows.filter(r=>r.w).length;
  const p = rows.reduce((s,r)=> s + (r.w ? r.o-1 : -1), 0);
  const pct = rows.length ? (w/rows.length*100).toFixed(1) : '0';
  return '<span class="big">' + w + ' / ' + rows.length + '</span>'
    + '<span class="sm">' + tr('dwon') + ' · ' + pct + '%</span>'
    + '<span class="pl ' + (p>=0?'p':'n') + '">' + (p>0?'+':'') + p.toFixed(2) + '</span>';
}

let D = null;

function currentData(){
  // Новый формат отдаёт D.sports.{all|football|basketball}. Старый
  // (до разделения банка) — только плоские поля на верхнем уровне,
  // которые совпадают со срезом "all". Если D.sports нет — используем
  // D целиком, чтобы страница не сломалась на старом public.json.
  if (D && D.sports && D.sports[sport]) return D.sports[sport];
  return D || {};
}

function drawSpark(){
  const S = currentData();
  const c = (S.curve && S.curve.length) ? S.curve : [100];
  const W = 480, H = 68;
  const lo = Math.min(...c, 100), hi = Math.max(...c, 100);
  const x = i => c.length > 1 ? i / (c.length - 1) * W : 0;
  const y = v => H - (v - lo) / (hi - lo || 1) * (H - 6) - 3;
  const line = c.map((v,i) => (i?'L':'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  el('spark').innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="68" preserveAspectRatio="none" role="img">'
    + '<line x1="0" x2="' + W + '" y1="' + y(100).toFixed(1) + '" y2="' + y(100).toFixed(1)
    + '" stroke="rgba(255,255,255,.22)" stroke-width="1" stroke-dasharray="4 5"/>'
    + '<path d="' + line + '" fill="none" stroke="var(--amber)" stroke-width="2.5" '
    + 'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
}

function statItem(label, valueHtml, sign){
  const cls = sign === 'p' ? ' p' : (sign === 'n' ? ' n' : '');
  return '<div class="item"><span class="lbl">' + label + '</span><span class="val' + cls + '">' + valueHtml + '</span></div>';
}

function renderStats(S){
  const na = tr('na');
  const units = tr('units');

  const avgOdd = (S.avg_odd != null) ? f2(S.avg_odd) : na;
  const avgOddWins = (S.avg_odd_wins != null) ? f2(S.avg_odd_wins) : na;

  const dd_ = S.max_drawdown || 0;
  const ddText = dd_ < 0 ? (dd_.toFixed(2) + ' ' + units) : ('0.00 ' + units);
  const ddSign = dd_ < 0 ? 'n' : '';

  const best = S.best_streak || 0;
  const worst = S.worst_streak || 0;
  const cur = S.current_streak || 0;

  const bestText = best > 0 ? ('+' + best) : String(best);
  const worstText = String(worst);
  const curText = cur > 0 ? ('+' + cur) : String(cur);
  const curSign = cur > 0 ? 'p' : (cur < 0 ? 'n' : '');

  el('stats-title').textContent = tr('statsTitle');
  el('stats-grid').innerHTML =
    statItem(tr('avgOdd'), avgOdd) +
    statItem(tr('avgOddWins'), avgOddWins) +
    statItem(tr('maxDD'), ddText, ddSign) +
    '<div class="stats-sep"></div>' +
    statItem(tr('bestStreak'), bestText, best > 0 ? 'p' : '') +
    statItem(tr('worstStreak'), worstText, worst < 0 ? 'n' : '') +
    statItem(tr('curStreak'), curText, curSign);
}

function render(){
  if (!D) return;
  CARDS = [];
  document.documentElement.lang = lang;

  el('langs').innerHTML = LANGS.map(([c,label]) =>
    '<button type="button" data-l="' + c + '" aria-pressed="' + (c===lang) + '">' + label + '</button>').join('');

  el('sports').innerHTML = SPORTS.map(([s,key]) =>
    '<button type="button" data-s="' + s + '" aria-pressed="' + (s===sport) + '">' + tr(key) + '</button>').join('');

  el('brand').textContent   = tr('brand');
  el('sub').textContent      = tr('sub');
  el('tagline').textContent = tr('tag');
  el('cap').textContent     = tr('bank');

  const S = currentData();

  el('bank').textContent    = f2(S.bank ?? 100);
  el('from').textContent    = S.first ? tr('from', {d: dd(S.first)}) : '';

  drawSpark();

  const n = S.n || 0;
  const wins = S.wins || 0;
  const bank = S.bank ?? 100;
  const roiPct = n ? ((bank - 100) / n * 100) : 0;
  const profit = bank - 100;
  const hitPct = n ? (wins / n * 100) : 0;

  // ИЗМЕНЕНО 24.09 (по просьбе Игоря): раньше первой и самой крупной
  // цифрой в hero была "Точность" — для ставок это вводит в заблуждение
  // без среднего кэфа рядом. Теперь на первом месте ROI и прибыль,
  // количество ставок — третьим, а точность ушла в маленькую строку
  // под таблицей (hitrow), она всё ещё видна, но не главная.
  el('hrow').innerHTML =
    '<div><b>' + (roiPct >= 0 ? '+' : '') + roiPct.toFixed(1) + '%</b><span>' + tr('roi') + '</span></div>' +
    '<div><b>' + (profit >= 0 ? '+' : '') + f2(profit) + '</b><span>' + tr('profit') + '</span></div>' +
    '<div><b>' + n + '</b><span>' + tr('bets') + '</span></div>';
  el('subrow').textContent = n ? tr('hitrow', {pct: hitPct.toFixed(0), wins: wins, n: n}) : '';

  renderStats(S);

  el('meta').innerHTML = (S.last_day ? tr('updtop', {d: dd(S.last_day)}) + '<br>' : '') + tr('src');

  el('live-title').textContent = tr('live');
  if (D.pending && D.pending.length){
    el('live-sec').hidden = false;
    el('live').innerHTML = D.pending.map(pendingHTML).join('');
  } else {
    el('live-sec').hidden = false;
    el('live').innerHTML = '<div class="card">' + tr('nolive') + '</div>';
  }

  const last = S.last || [], prevrows = S.prevrows || [];

  if (S.last_day){
    el('d1-sec').hidden = false;
    el('d1-title').innerHTML = dd(S.last_day) + ' <span class="count">· '
      + tr('dayb', {n: last.length, w: plural(last.length)}) + '</span>';
    el('d1').innerHTML = last.map(rowHTML).join('');
    el('d1sum').innerHTML = dayHead(last);
  } else {
    el('d1-sec').hidden = true;
  }

  if (S.prev_day){
    el('d2-sec').hidden = false;
    el('d2-title').innerHTML = dd(S.prev_day) + ' <span class="count">· '
      + tr('dayb', {n: prevrows.length, w: plural(prevrows.length)}) + '</span>';
    el('d2').innerHTML = prevrows.map(rowHTML).join('');
    el('d2sum').innerHTML = dayHead(prevrows);
  } else {
    el('d2-sec').hidden = true;
  }

  el('honest').innerHTML = tr('honest', {n: n});
  el('how-title').textContent = tr('how');
  el('how-body').innerHTML = ['h1','h2','h3','h4'].map(k => '<p>' + tr(k) + '</p>').join('')
    + '<p style="color:var(--muted);font-size:13px">' + tr('tapHint') + '</p>';

  const feed = S.feed || [];
  el('feed-title').textContent = tr('feed');
  el('feed').innerHTML = feed.map(rowHTML).join('');
  el('stamp').textContent = S.last_day ? tr('upd', {d: dd(S.last_day)}) : '';
}

el('langs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  lang = b.dataset.l;
  try{ localStorage.setItem('fk_lang', lang); }catch(err){}
  render();
});

el('sports').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  sport = b.dataset.s;
  try{ localStorage.setItem('fk_sport', sport); }catch(err){}
  render();
});

async function loadData(){
  try{
    const res = await fetch('public.json', {cache:'no-store'});
    D = await res.json();
  }catch(e){
    const empty = {bank:100,n:0,wins:0,curve:[100],last_day:null,prev_day:null,last:[],prevrows:[],feed:[],first:null,
                   avg_odd:null,avg_odd_wins:null,max_drawdown:0,best_streak:0,worst_streak:0,current_streak:0};
    D = {bank:100, n:0, wins:0, curve:[100], last_day:null, prev_day:null, last:[], prevrows:[], pending:[], feed:[], first:null,
         sports:{all: {...empty}, football: {...empty}, basketball: {...empty}}};
  }
  render();
}
loadData();
</script>
