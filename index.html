  const line = c.map((v,i) => (i?'L':'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  el('spark').innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="68" preserveAspectRatio="none" role="img">'
    + '<line x1="0" x2="' + W + '" y1="' + y(100).toFixed(1) + '" y2="' + y(100).toFixed(1)
    + '" stroke="rgba(255,255,255,.22)" stroke-width="1" stroke-dasharray="4 5"/>'
    + '<path d="' + line + '" fill="none" stroke="var(--amber)" stroke-width="2.5" '
    + 'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
})();

/* ---------- render ---------- */
function rowHTML(r){
  const profit = r.w ? (r.o - 1) : -1;
  return '<div class="res">'
    + '<div class="mark ' + (r.w?'w':'l') + '">' + (r.w?'✓':'✕') + '</div>'
    + '<div class="body"><div class="t">' + esc(team(r.h)) + ' — ' + esc(team(r.a)) + '</div>'
    + '<div class="m">' + tr('bet') + ': ' + esc(team(r.t)) + (r.s ? ' · ' + esc(r.s) : '') + '</div></div>'
    + '<div class="r">' + f2(r.o) + '<b>' + (profit>0?'+':'') + profit.toFixed(2) + '</b></div>'
    + '</div>';
}
function dayHead(rows){
  const w = rows.filter(r=>r.w).length;
  const p = rows.reduce((s,r)=> s + (r.w ? r.o-1 : -1), 0);
  const pct = rows.length ? (w/rows.length*100).toFixed(1) : '0';
  return '<span class="big">' + w + ' / ' + rows.length + '</span>'
    + '<span class="sm">' + tr('dwon') + ' · ' + pct + '%</span>'
    + '<span class="pl ' + (p>=0?'p':'n') + '">' + (p>0?'+':'') + p.toFixed(2) + '</span>';
}

function render(){
  document.documentElement.lang = lang;

  el('langs').innerHTML = LANGS.map(([c,label]) =>
    '<button type="button" data-l="' + c + '" aria-pressed="' + (c===lang) + '">' + label + '</button>').join('');

  el('brand').textContent   = tr('brand');
  el('sub').textContent      = tr('sub');
  el('tagline').textContent = tr('tag');
  el('cap').textContent     = tr('bank');
  el('bank').textContent    = f2(D.bank);
  el('from').textContent    = tr('from', {d: dd(D.first)});

  el('hrow').innerHTML =
    '<div><b>' + D.n + '</b><span>' + tr('bets') + '</span></div>' +
    '<div><b>' + D.wins + '</b><span>' + tr('won') + '</span></div>' +
    '<div><b>' + (D.wins / D.n * 100).toFixed(0) + '%</b><span>' + tr('hit') + '</span></div>' +
    '<div><b>+' + ((D.bank - 100) / D.n * 100).toFixed(1) + '%</b><span>' + tr('roi') + '</span></div>' +
    '<div><b>+' + f2(D.bank - 100) + '</b><span>' + tr('profit') + '</span></div>';

  el('meta').innerHTML = tr('updtop', {d: dd(D.last_day)}) + '<br>' + tr('src');

  el('live-title').textContent = tr('live');
  if (D.pending.length){
    el('live-sec').hidden = false;
    el('live').innerHTML = D.pending.map(p =>
      '<div class="card live"><div class="when">' + esc(p.d) + '</div>'
      + '<div class="match">' + esc(team(p.h)) + ' — ' + esc(team(p.a)) + '</div>'
      + '<div class="league">' + esc(league(p.l)) + '</div>'
      + '<div class="pick"><span class="what">' + esc(team(p.t)) + '</span>'
      + '<span class="odd">' + f2(p.o) + '</span></div></div>').join('');
  } else {
    el('live').innerHTML = '<div class="card">' + tr('nolive') + '</div>';
  }

  el('d1-title').innerHTML = dd(D.last_day) + ' <span class="count">· '
    + tr('dayb', {n: D.last.length, w: plural(D.last.length)}) + '</span>';
  el('d2-title').innerHTML = dd(D.prev_day) + ' <span class="count">· '
    + tr('dayb', {n: D.prevrows.length, w: plural(D.prevrows.length)}) + '</span>';
  el('d1').innerHTML = D.last.map(rowHTML).join('');
  el('d2').innerHTML = D.prevrows.map(rowHTML).join('');
  el('d1sum').innerHTML = dayHead(D.last);
  el('d2sum').innerHTML = dayHead(D.prevrows);

  el('honest').innerHTML = tr('honest', {n: D.n});
  el('how-title').textContent = tr('how');
  el('how-body').innerHTML = ['h1','h2','h3','h4'].map(k => '<p>' + tr(k) + '</p>').join('');

  el('feed-title').textContent = tr('feed');
  el('feed').innerHTML = D.feed.map(rowHTML).join('');
  el('stamp').textContent = tr('upd', {d: dd(D.last_day)});
}

render();

el('langs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  lang = b.dataset.l;
  try{ localStorage.setItem('fk_lang', lang); }catch(err){}
  render();
});
</script>

</body>
</html>
